<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script type="module">
        import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import {getAuth, signInWithPopup, GithubAuthProvider} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBDKTnyhDXCuqhnFN4WWTZ72X8k5Mjnygk",
            authDomain: "relay-9c244.firebaseapp.com",
            projectId: "relay-9c244",
            storageBucket: "relay-9c244.firebasestorage.app",
            messagingSenderId: "1034955528530",
            appId: "1:1034955528530:web:d53aaf84e62baf08da828b",
            measurementId: "G-X1H6GJGEKN"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GithubAuthProvider();
        provider.addScope("repo")

        async function login(){
            const result = await signInWithPopup(auth, provider);

            const credential = GithubAuthProvider.credentialFromResult(result);
            const githubToken = credential.accessToken;

            const response = await fetch(
                "https://api.github.com/user/repos?per_page=100",
                {
                    headers: {
                        Authorization: `Bearer ${githubToken}`,
                        Accept: "application/vnd.github+json"
                    }
                }
            );

            const repos = await response.json();
            console.log("Repositories:", repos);

            console.log(`Bearer ${result.user.accessToken}`);
        }

        document
            .getElementById("login")
            .addEventListener("click", login);
    </script>
</head>
<body>
    <button id="login">Log in with Github</button>    
</body>
</html>
